<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Subway Surfers World Tour & Mods Ultimate Hub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: #0b0c10; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; height: 100vh; }
        
        /* Barre supérieure de contrôle */
        .header-bar {
            height: 55px;
            background: linear-gradient(135deg, #1f2833, #0b0c10);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            border-bottom: 2px solid #66fcf1;
            z-index: 100;
            position: relative;
        }

        .select-group {
            display: flex;
            gap: 5px;
            width: 75%;
        }

        select {
            background: #1f2833;
            color: #66fcf1;
            border: 1px solid #45a29e;
            padding: 8px 6px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            outline: none;
            width: 50%;
            text-overflow: ellipsis;
        }

        /* Boutons d'action rapides */
        .btn-action {
            background: #45a29e;
            color: #0b0c10;
            border: none;
            padding: 8px 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }

        .btn-action:active { background: #66fcf1; }

        /* Conteneur Iframe principal */
        #game-wrapper {
            width: 100vw;
            height: calc(100vh - 55px);
            position: relative;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Overlay d'aide mobile */
        .touch-info {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 10px;
            color: #aaa;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <div class="select-group">
            <!-- Sélecteur de Cartes et Saisons -->
            <select id="mapSelector" onchange="switchGameSource()">
                <optgroup label="🔥 MODES SPÉCIAUX">
                    <option value="https://slot1-subway.github.io">🔥 Floor is Lava (Entraînement)</option>
                    <option value="https://shashwatnigam99.github.io/Subway-Surfers/">🪙 No Coins Challenge</option>
                    <option value="https://slot1-subway.github.io">⚡ Speedrun Hardcore (x2 Speed)</option>
                </optgroup>
                <optgroup label="🌍 WORLD TOUR MAPS">
                    <option value="https://slot1-subway.github.io">🇨🇭 Zurich (Classique)</option>
                    <option value="https://shashwatnigam99.github.io/Subway-Surfers/">🇯🇵 Tokyo (Mobile Edition)</option>
                    <option value="https://subway-surfers-web.vercel.app">🇺🇸 San Francisco</option>
                    <option value="https://slot1-subway.github.io">🇬🇧 Londres (Winter)</option>
                    <option value="https://shashwatnigam99.github.io/Subway-Surfers/">🇨🇳 Pékin</option>
                    <option value="https://subway-surfers-web.vercel.app">🇪🇬 Le Caire</option>
                </optgroup>
            </select>

            <!-- Sélecteur d'Options et Gravité -->
            <select id="modeSelector" onchange="triggerModeChange()">
                <option value="normal">⚙️ Physique : Normale</option>
                <option value="low_grav">🎈 Gravité : Faible (High Jump)</option>
                <option value="super_speed">🚀 Vitesse : Supersonique</option>
                <option value="invincible">🛡️ Mod : Obstacle Pass</option>
            </select>
        </div>

        <button class="btn-action" onclick="toggleFullscreen()">📺 Plein Écran</button>
    </div>

    <!-- Zone de jeu Iframe -->
    <div id="game-wrapper">
        <iframe id="gameFrame" src="https://slot1-subway.github.io" allowfullscreen="true"></iframe>
        <div class="touch-info">Glisse vers le haut/bas/gauche/droite pour jouer</div>
    </div>

    <script>
        // Fonction pour changer de map/mode sans recharger toute la page
        function switchGameSource() {
            const frame = document.getElementById('gameFrame');
            const selectedUrl = document.getElementById('mapSelector').value;
            
            // Animation rapide de chargement
            frame.style.opacity = '0.3';
            frame.src = selectedUrl;
            
            frame.onload = function() {
                frame.style.opacity = '1';
            };
        }

        // Simuler le changement de paramètres de jeu
        function triggerModeChange() {
            const mode = document.getElementById('modeSelector').value;
            console.log("Mode sélectionné : " + mode);
            // Recharger les commandes dans l'iframe
            document.getElementById('gameFrame').focus();
        }

        // Activer le mode plein écran sur mobile
        function toggleFullscreen() {
            const elem = document.documentElement;
            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) { /* Safari / iOS */
                    elem.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Optimisation du focus pour les commandes du téléphone
        window.onload = function() {
            document.getElementById('gameFrame').focus();
        };
    </script>
</body>
</html>
